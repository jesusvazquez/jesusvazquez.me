<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jesús Vázquez — Staff Software Engineer at Grafana Labs.">
<title>Jesús Vázquez</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #f5f5f5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 22rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  p {
    margin: 0.5rem 0 0;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  p a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  hr {
    border: none;
    border-top: 1px solid var(--fg);
    margin: 1.25rem 0;
    opacity: 0.3;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border: 1px solid var(--fg);
  }
  nav a:hover {
    background: var(--fg);
    color: var(--bg);
  }
</style>
</head>
<body>
  <main>
    <h1>Jesús Vázquez</h1>
    <p>Staff Software Engineer · <a href="https://grafana.com/">Grafana Labs</a></p>
    <hr>
    <nav>
      <a href="https://www.linkedin.com/in/jesusvazquezp">LinkedIn</a>
      <a href="https://github.com/jesusvazquez">GitHub</a>
    </nav>
  </main>
</body>
</html>
